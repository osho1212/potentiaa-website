<!doctype html>
<meta charset="utf-8">
<title>strand tracer</title>
<!--
  THE HERO FIELD TRACER. Reads the strands out of the owner's reference STILL
  by ridge detection, warps them onto the artwork's module axis, and bakes the
  result to lib/heroFieldData.ts via /api/save-field. Dev only.

  Source is Potentiaa-Hero-4K.png, copied in as public/__ref.png. It replaced a
  frame grabbed off the reference video: the still is 4096 wide against the
  video's 1920, it has no inter-frame compression smearing the filaments, and
  the filaments are what we are trying to measure.

  Neither file is kept in this folder - both are large and everything under
  public/ ships. Copy back before running:

    public/__ref.png   <-  Potentiaa-Hero-4K.png

  Then open /__trace.html, wait for "ready to bake", and call __save().
-->
<style>
 body{margin:0;background:#07080f;color:#cfd6e6;font:11px ui-monospace,monospace}
 #out{padding:6px;white-space:pre-wrap;line-height:1.55}
 .g{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px}
 figure{margin:0;position:relative}
 canvas{width:100%;display:block;background:#000}
 figcaption{position:absolute;top:3px;left:5px;color:#fff;text-shadow:0 0 5px #000}
</style>
<div id="out">working…</div>
<div class="g" id="imgs"></div>
<script>
// Traced at 1600 wide. The still is 4096, but the filaments are ~1px there too;
// what the extra resolution buys is separation between filaments that the video
// smeared together, and 1600 keeps the Hessian pass inside a few seconds.
const W = 1600, H = 1067;
const log=[]; const say=(s)=>{log.push(s);document.getElementById('out').textContent=log.join('\n');};

function gaussKernel(sigma){
  const r=Math.max(1,Math.ceil(sigma*3)); const k=new Float32Array(2*r+1); let s=0;
  for(let i=-r;i<=r;i++){const v=Math.exp(-(i*i)/(2*sigma*sigma));k[i+r]=v;s+=v;}
  for(let i=0;i<k.length;i++)k[i]/=s; return {k,r};
}
function blur(src,sigma){
  const {k,r}=gaussKernel(sigma);
  const tmp=new Float32Array(W*H), dst=new Float32Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let a=0;
    for(let i=-r;i<=r;i++){const xx=Math.min(W-1,Math.max(0,x+i));a+=src[y*W+xx]*k[i+r];}tmp[y*W+x]=a;}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let a=0;
    for(let i=-r;i<=r;i++){const yy=Math.min(H-1,Math.max(0,y+i));a+=tmp[yy*W+x]*k[i+r];}dst[y*W+x]=a;}
  return dst;
}
const at=(a,x,y)=>a[Math.min(H-1,Math.max(0,y))*W+Math.min(W-1,Math.max(0,x))];
function bilinear(a,x,y){
  const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;
  return at(a,x0,y0)*(1-fx)*(1-fy)+at(a,x0+1,y0)*fx*(1-fy)+at(a,x0,y0+1)*(1-fx)*fy+at(a,x0+1,y0+1)*fx*fy;
}

const img=new Image(); img.src='/__ref.png';
const mod=new Image(); mod.src='/assets/hero/module.webp';
let ready=0;
const go=()=>{ if(++ready===2) start(); };
img.onload=go; mod.onload=go; mod.onerror=go;
function start(){
  const src=document.createElement('canvas'); src.width=W; src.height=H;
  const sg=src.getContext('2d',{willReadFrequently:true});
  sg.drawImage(img,0,0,W,H);
  const px=sg.getImageData(0,0,W,H).data;
  say(`still ${img.width}x${img.height} traced at ${W}x${H}`);

  const lum=new Float32Array(W*H), cr=new Float32Array(W*H), cb=new Float32Array(W*H);
  for(let i=0,j=0;i<px.length;i+=4,j++){
    lum[j]=px[i]*0.35+px[i+1]*0.4+px[i+2]*0.25; cr[j]=px[i]; cb[j]=px[i+2];
  }

  // ---- 1. mask the modules, FROM THE ARTWORK'S OWN ALPHA ----------------
  //
  // Not detected. Taken.
  //
  // Detecting the cubes out of the still kept failing at one end or the other.
  // Brightness catches the two lit cubes but not the dark navy one, so its
  // face came back covered in false strands; lowering the threshold until it
  // caught the dark one also caught the glow around the bright ones and ate
  // the rim light with it. Smoothness fared no better - a cube face and the
  // background are both smooth, and telling them apart by area and shape put
  // the count at two again.
  //
  // But the cubes are not unknown. public/assets/hero/module.webp is a render
  // of the SAME three modules with a transparent background, so its alpha
  // channel is their silhouette, exactly, for free. Two point pairs - the weld
  // between the top two, and the centre of the lower one - fix the similarity
  // that puts it over the still.
  //
  // Then ERODE it. The bright edge running along each cube is field, not cube,
  // and the owner wants it traced; a silhouette-tight mask covers it. Pulling
  // the mask a few pixels inside the silhouette leaves the face covered and
  // the rim exposed, which is the distinction that matters.
  const REF_A={x:1195,y:310};      // weld between the top and middle modules
  const REF_B={x:910, y:640};      // centre of the lower module
  // The same two points in module.webp, derived from MODULE_A / MODULE_B in
  // lib/heroEnergy: those are in artwork half-width units about its centre.
  const MW=mod.naturalWidth||1524, MH=mod.naturalHeight||1600;
  const half=MW/2;
  const MOD_A={x:half+0.18*half, y:MH/2-0.54*half};
  const MOD_B={x:half-0.30*half, y:MH/2+0.56*half};

  const grown=new Uint8Array(W*H);
  let maskN=0, maskSource='none';
  if(mod.naturalWidth){
    const dm={x:REF_A.x-REF_B.x, y:REF_A.y-REF_B.y};
    const dd={x:MOD_A.x-MOD_B.x, y:MOD_A.y-MOD_B.y};
    const k=Math.hypot(dm.x,dm.y)/Math.hypot(dd.x,dd.y);
    const rot=Math.atan2(dm.y,dm.x)-Math.atan2(dd.y,dd.x);

    // A little over life size, then eroded back harder.
    //
    // The two anchors are read by eye off the still, and an error of a few
    // pixels there scales into tens across the length of the chain - measured,
    // the mask sat about 36px short at the coral cube and left its face open.
    // Oversizing absorbs that error, and the erosion below takes the extra off
    // again, so the net mask still sits inside the silhouette where it has to.
    const FUDGE=1.10;
    const mc=document.createElement('canvas'); mc.width=W; mc.height=H;
    const mg=mc.getContext('2d',{willReadFrequently:true});
    mg.translate(REF_B.x, REF_B.y);
    mg.rotate(rot);
    mg.scale(k*FUDGE,k*FUDGE);
    mg.translate(-MOD_B.x, -MOD_B.y);
    mg.drawImage(mod,0,0);
    const md=mg.getImageData(0,0,W,H).data;

    // Alpha over a threshold is the silhouette; erode it to expose the rim.
    const solid=new Uint8Array(W*H);
    for(let i=0;i<W*H;i++) solid[i]= md[i*4+3]>110 ? 1 : 0;
    const ERODE=22;
    const tmp=new Uint8Array(W*H);
    const sA=(a,x,y)=> (x<0||y<0||x>=W||y>=H) ? 0 : a[y*W+x];
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      let v=1; for(let i=-ERODE;i<=ERODE&&v;i++) v = v && sA(solid,x+i,y);
      tmp[y*W+x]=v;
    }
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      let v=1; for(let i=-ERODE;i<=ERODE&&v;i++) v = v && sA(tmp,x,y+i);
      grown[y*W+x]=v;
    }
    for(let i=0;i<W*H;i++) maskN+=grown[i];
    maskSource=`module.webp alpha, rotated ${(rot*180/Math.PI).toFixed(1)}°, eroded ${ERODE}px`;
  }
  say(`mask: ${maskSource} · covers ${(100*maskN/(W*H)).toFixed(1)}% of frame`);

  // ---- 2. ridge detection ----------------------------------------------
  // Sigma scales with the trace resolution: a filament is about as wide in
  // pixels here as it was in the video, but there are more pixels across it.
  const sm=blur(lum,1.9);
  const ridge=new Float32Array(W*H), tx=new Float32Array(W*H), ty=new Float32Array(W*H);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=y*W+x;
    const Ixx=at(sm,x+1,y)-2*sm[i]+at(sm,x-1,y);
    const Iyy=at(sm,x,y+1)-2*sm[i]+at(sm,x,y-1);
    const Ixy=(at(sm,x+1,y+1)-at(sm,x-1,y+1)-at(sm,x+1,y-1)+at(sm,x-1,y-1))/4;
    const tr=Ixx+Iyy, det=Ixx*Iyy-Ixy*Ixy;
    const disc=Math.sqrt(Math.max(0,tr*tr/4-det));
    const l1=tr/2-disc;              // most negative: curvature ACROSS a bright ridge
    if(l1>=0) continue;
    let ax=Ixy, ay=l1-Ixx; const n=Math.hypot(ax,ay)||1; ax/=n; ay/=n;
    ridge[i]=-l1; tx[i]=-ay; ty[i]=ax;   // tangent = perpendicular to the across-vector
  }

  // ---- 3. non-maximum suppression across the ridge ----------------------
  const nms=new Float32Array(W*H);
  for(let y=12;y<H-12;y++)for(let x=12;x<W-12;x++){
    const i=y*W+x, s=ridge[i];
    if(s<=0||grown[i])continue;
    const ax=-ty[i], ay=tx[i];
    if(s>=bilinear(ridge,x+ax,y+ay) && s>=bilinear(ridge,x-ax,y-ay)) nms[i]=s;
  }
  const sorted=[...nms].filter(v=>v>0).sort((a,b)=>a-b);
  const hiT=sorted[Math.floor(sorted.length*0.86)];
  const loT=sorted[Math.floor(sorted.length*0.20)];
  say(`ridge pixels ${sorted.length} · seedT ${hiT.toFixed(3)} · keepT ${loT.toFixed(3)}`);

  // ---- 4. trace ----------------------------------------------------------
  const visited=new Uint8Array(W*H);
  const seeds=[]; for(let i=0;i<W*H;i++) if(nms[i]>=hiT) seeds.push(i);
  seeds.sort((a,b)=>nms[b]-nms[a]);

  const STEP=2.0, MAXLEN=1100, MINLEN=30, MARK=3, GAP=4;
  const strands=[];
  const mark=(x,y)=>{for(let dy=-MARK;dy<=MARK;dy++)for(let dx=-MARK;dx<=MARK;dx++){
    const xx=Math.round(x+dx),yy=Math.round(y+dy);
    if(xx>=0&&xx<W&&yy>=0&&yy<H) visited[yy*W+xx]=1;}};
  const walk=(sx,sy,sign)=>{
    const pts=[]; let x=sx,y=sy;
    let dx=bilinear(tx,x,y)*sign, dy=bilinear(ty,x,y)*sign;
    const n0=Math.hypot(dx,dy); if(!n0) return pts; dx/=n0; dy/=n0;
    let weak=0, held=0;
    for(let s=0;s<MAXLEN;s++){
      x+=dx*STEP; y+=dy*STEP;
      if(x<12||y<12||x>W-13||y>H-13) break;
      if(at(grown,Math.round(x),Math.round(y))) break;
      // Coast a few steps through a crossing, where the ridge is locally a
      // blob and its orientation goes ambiguous. Breaking on the first weak
      // sample cuts every long sweep into fragments at its crossings.
      const strong = bilinear(nms,x,y)>=loT || bilinear(ridge,x,y)>=loT;
      if(strong){weak=0;held=0;} else {weak++;held++; if(weak>GAP) break;}
      pts.push(x,y); mark(x,y);
      let nx=bilinear(tx,x,y), ny=bilinear(ty,x,y);
      if(nx*dx+ny*dy<0){nx=-nx;ny=-ny;}
      const m=Math.hypot(nx,ny);
      if(m>1e-4){
        nx/=m;ny/=m;
        const keep = strong?0.55:0.82;   // trust the field less while coasting
        dx=dx*keep+nx*(1-keep); dy=dy*keep+ny*(1-keep);
        const q=Math.hypot(dx,dy); dx/=q; dy/=q;
      }
    }
    if(held>0) pts.length=Math.max(0,pts.length-held*2);
    return pts;
  };

  for(const i of seeds){
    if(visited[i])continue;
    const sx=i%W, sy=(i/W)|0;
    const fwd=walk(sx,sy,1), back=walk(sx,sy,-1);
    const pts=[];
    for(let k=back.length-2;k>=0;k-=2) pts.push(back[k],back[k+1]);
    pts.push(sx,sy);
    for(let k=0;k<fwd.length;k+=2) pts.push(fwd[k],fwd[k+1]);
    mark(sx,sy);
    if(pts.length/2<MINLEN) continue;
    // Reject a cube outline by SHAPE: it closes on itself and turns through a
    // full circle doing it. Signed turning, so the tracer's own jitter cancels
    // instead of accumulating past the threshold on every long strand.
    let turn=0;
    for(let k=2;k+3<pts.length;k+=2){
      const ax=pts[k]-pts[k-2], ay=pts[k+1]-pts[k-1];
      const bx=pts[k+2]-pts[k], by=pts[k+3]-pts[k+1];
      turn+=Math.atan2(ax*by-ay*bx, ax*bx+ay*by);
    }
    const n=pts.length;
    const span=Math.hypot(pts[n-2]-pts[0],pts[n-1]-pts[1]);
    if(span < (n/2)*STEP*0.26 || Math.abs(turn)>4.4) continue;
    strands.push(pts);
  }
  const lens=strands.map(p=>p.length/2).sort((a,b)=>a-b);
  say(`traced ${strands.length} strands · median ${lens[lens.length>>1]||0} pts · longest ${lens[lens.length-1]||0}`);

  // ---- 5. warp onto the artwork's module axis ---------------------------
  // Two point pairs fix a similarity exactly - rotation, uniform scale and
  // translation, no shear - so the field's shape survives and only its
  // orientation and size change. Read off the still against a coordinate grid.
  // REF_A / REF_B are declared with the mask above - the same two anchors
  const SITE_A={x:0.18,y:0.54};  // MODULE_A in lib/heroEnergy
  const SITE_B={x:-0.3,y:-0.56}; // MODULE_B
  const vA={x:REF_A.x,y:-REF_A.y}, vB={x:REF_B.x,y:-REF_B.y};   // image y is down
  const dv={x:vA.x-vB.x,y:vA.y-vB.y}, ds={x:SITE_A.x-SITE_B.x,y:SITE_A.y-SITE_B.y};
  const SCALE_F=Math.hypot(ds.x,ds.y)/Math.hypot(dv.x,dv.y);
  const ROT=Math.atan2(ds.y,ds.x)-Math.atan2(dv.y,dv.x);
  const CR=Math.cos(ROT), SR=Math.sin(ROT);
  say(`warp: rotate ${(ROT*180/Math.PI).toFixed(1)}° · scale ${SCALE_F.toFixed(6)}`);
  const toField=(px_,py_)=>{
    const ax=(px_-vB.x)*SCALE_F, ay=((-py_)-vB.y)*SCALE_F;
    return {x:SITE_B.x+ax*CR-ay*SR, y:SITE_B.y+ax*SR+ay*CR};
  };

  // ---- 6. resample, rank, pack ------------------------------------------
  const OUT_SAMPLES=40, KEEP=460, Q=4096;
  const ranked=strands.slice().sort((a,b)=>b.length-a.length).slice(0,KEEP);
  const packed=new Int16Array(ranked.length*(1+OUT_SAMPLES*2));
  let wp=0, coral=0;
  for(const pts of ranked){
    const m=pts.length/2;
    const cum=new Float64Array(m);
    for(let k=1;k<m;k++) cum[k]=cum[k-1]+Math.hypot(pts[k*2]-pts[k*2-2],pts[k*2+1]-pts[k*2-1]);
    const total=cum[m-1]||1;
    // colour family, from the still under the strand's own middle
    const mid=Math.floor(m/2)*2;
    const r=at(cr,Math.round(pts[mid]),Math.round(pts[mid+1]));
    const b=at(cb,Math.round(pts[mid]),Math.round(pts[mid+1]));
    const fam = r>b*1.45 ? 1 : 0;
    if(fam) coral++;
    packed[wp++]=fam;
    let k=0;
    for(let s=0;s<OUT_SAMPLES;s++){
      const want=(s/(OUT_SAMPLES-1))*total;
      while(k<m-2 && cum[k+1]<want) k++;
      const seg=(cum[k+1]-cum[k])||1;
      const f=Math.min(1,Math.max(0,(want-cum[k])/seg));
      const p=toField(pts[k*2]+(pts[k*2+2]-pts[k*2])*f, pts[k*2+1]+(pts[k*2+3]-pts[k*2+1])*f);
      packed[wp++]=Math.max(-32768,Math.min(32767,Math.round(p.x*Q)));
      packed[wp++]=Math.max(-32768,Math.min(32767,Math.round(p.y*Q)));
    }
  }
  say(`packed ${ranked.length} × ${OUT_SAMPLES} · ${coral} coral (${(100*coral/ranked.length).toFixed(1)}%), ${ranked.length-coral} blue`);

  const bytes=new Uint8Array(packed.buffer);
  let bin=''; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  const b64=btoa(bin);
  say(`payload ${(b64.length/1024).toFixed(1)} KB base64`);

  window.__save=async()=>{
    const res=await fetch('/api/save-field',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({data:b64,strands:ranked.length,samples:OUT_SAMPLES,
        note:`Traced from the reference STILL Potentiaa-Hero-4K.png at ${W}x${H}, then warped ${(ROT*180/Math.PI).toFixed(1)} degrees onto the artwork's module axis.`})});
    return await res.json();
  };
  say('ready to bake — call __save()');

  // ---- panels ------------------------------------------------------------
  const grid=document.getElementById('imgs');
  const panel=(label)=>{const f=document.createElement('figure');
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const cap=document.createElement('figcaption'); cap.textContent=label;
    f.append(cv,cap); grid.append(f); return cv.getContext('2d');};

  const g1=panel('1 · still, shadows lifted');
  const d1=sg.getImageData(0,0,W,H);
  for(let i=0;i<d1.data.length;i+=4) for(let k=0;k<3;k++)
    d1.data[i+k]=Math.min(255,255*Math.pow(d1.data[i+k]/255,0.45));
  g1.putImageData(d1,0,0);

  const gM=panel('1b · module mask (pink) - faces covered, rims exposed');
  const dM=sg.getImageData(0,0,W,H);
  for(let i=0;i<d1.data.length;i+=4) dM.data[i]=d1.data[i], dM.data[i+1]=d1.data[i+1], dM.data[i+2]=d1.data[i+2];
  for(let i=0;i<W*H;i++) if(grown[i]){ dM.data[i*4]=255; dM.data[i*4+1]=0; dM.data[i*4+2]=110; }
  gM.putImageData(dM,0,0);

  const g2=panel('2 · ridge response (modules masked)');
  const d2=g2.createImageData(W,H);
  let mx=0; for(let i=0;i<W*H;i++) if(nms[i]>mx)mx=nms[i];
  for(let i=0;i<W*H;i++){const v=Math.min(255,255*Math.pow(nms[i]/mx,0.45));
    d2.data[i*4]=v*0.55; d2.data[i*4+1]=v*0.75; d2.data[i*4+2]=v; d2.data[i*4+3]=255;}
  g2.putImageData(d2,0,0);

  const g3=panel(`3 · traced centrelines (${strands.length})`);
  g3.fillStyle='#000'; g3.fillRect(0,0,W,H);
  g3.globalCompositeOperation='lighter'; g3.lineCap='round';
  for(const pts of strands){
    const mid=Math.floor(pts.length/4)*2;
    const r=at(cr,Math.round(pts[mid]),Math.round(pts[mid+1]));
    const b=at(cb,Math.round(pts[mid]),Math.round(pts[mid+1]));
    const col = r>b*1.45 ? '255,120,96' : '92,148,255';
    g3.beginPath(); g3.moveTo(pts[0],pts[1]);
    for(let k=2;k<pts.length;k+=2) g3.lineTo(pts[k],pts[k+1]);
    g3.strokeStyle=`rgba(${col},0.09)`; g3.lineWidth=5; g3.stroke();
    g3.strokeStyle=`rgba(${col},0.8)`; g3.lineWidth=1; g3.stroke();
  }

  const g4=panel('4 · traced over the still');
  g4.putImageData(d1,0,0);
  g4.strokeStyle='rgba(120,255,140,0.7)'; g4.lineWidth=1; g4.lineCap='round';
  for(const pts of strands){
    g4.beginPath(); g4.moveTo(pts[0],pts[1]);
    for(let k=2;k<pts.length;k+=2) g4.lineTo(pts[k],pts[k+1]);
    g4.stroke();
  }
  document.title='ready';
};
</script>
